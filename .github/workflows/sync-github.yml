name: Sync GitHub projects

# Finds new/updated repos on your GitHub account, grabs their preview images, and commits
# the result. Your host (Vercel/Netlify/Cloudflare) redeploys on that commit.
on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: [github.config.json]

permissions:
  contents: write

concurrency:
  group: sync-github
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Sync projects from GitHub
        run: node scripts/sync-github.mjs
        env:
          PRIVATE_REPOS_TOKEN: ${{ secrets.PRIVATE_REPOS_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github-projects.json public/projects/auto
          if git diff --cached --quiet; then
            echo "No project changes."
          else
            git commit -m "chore: sync GitHub projects"
            git push
          fi
